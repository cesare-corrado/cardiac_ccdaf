site_name: CCDAF
site_description: Cardiac Clinical Data Analysis Framework — documentation
site_url: https://cesare-corrado.github.io/cardiac_ccdaf/
repo_url: https://github.com/cesare-corrado/cardiac_ccdaf
repo_name: cesare-corrado/cardiac_ccdaf
docs_dir: docs
# Build real page.html files (not page/index.html). Directory URLs only resolve
# under a web server; this lets the site be browsed offline over file://.
use_directory_urls: false

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - User guide:
      - Overview: user-guide/index.md
      - Loading & mesh info: user-guide/loading.md
      - Segmentation: user-guide/segmentation.md
      - Seeds & tagging: user-guide/seeds-tagging.md
      - Manual correction: user-guide/manual-correction.md
      - Clipping: user-guide/clipping.md
      - Post-processing: user-guide/post-processing.md
      - EAM & visualisation: user-guide/eam-visualisation.md
  - Keyboard & mouse: shortcuts.md
  - File formats: file-formats.md
  - Concepts & methods: concepts.md
  - Troubleshooting: troubleshooting.md
  - Developer:
      - Architecture: developer/architecture.md
      - Contributing: developer/contributing.md
      - EAM real-data verification: eam-real-data-verification.md
  - API reference:
      - Overview: reference/index.md
      - ccdaf.core: reference/core.md
      - ccdaf.io: reference/io.md
      - ccdaf.interaction: reference/interaction.md
      - ccdaf.gui: reference/gui.md
      - ccdaf.app: reference/app.md
