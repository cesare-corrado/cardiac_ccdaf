name: Docs

# Build the MkDocs site and publish it to GitHub Pages on every push to main.
#
# The API reference is generated from docstrings by mkdocstrings via *static*
# analysis (griffe reads src/ directly), so the heavy runtime stack
# (VTK / Qt / SimpleITK) is NOT installed here — only the docs tooling, which
# mirrors the [docs] extra in pyproject.toml. That keeps the build to seconds.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:   # allow manual runs from the Actions tab

# Least-privilege token plus the permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs-material>=9.5" "mkdocstrings[python]>=0.25"
      - name: Build (strict)
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
