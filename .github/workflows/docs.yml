name: Docs

# Build the MkDocs site on pushes and PRs (a docs "lint gate" that catches
# broken links via --strict), but PUBLISH to GitHub Pages only from main.
#
# The API reference is generated from docstrings by mkdocstrings via *static*
# analysis (griffe reads src/ directly), so the heavy runtime stack
# (VTK / Qt / SimpleITK) is not installed here — only the docs tooling, which
# mirrors the [docs] extra in pyproject.toml. That keeps the build to seconds.
on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:   # allow manual runs from the Actions tab

# Least-privilege token plus the permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs-material>=9.5" "mkdocstrings[python]>=0.25"
      - name: Build (strict)
        run: mkdocs build --strict
      # Package for Pages only when this run will actually deploy (from main,
      # not a pull request). Other runs stop at the strict build above.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    # Only main publishes to the live site — a dispatch from develop builds but
    # does not deploy, and pull requests never deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
